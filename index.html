<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<title>ទំនាក់ទំនងខ្ញុំ · Contact Me</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--s:#14161a;--s2:#1b1e24;--l:#252932;--a:#5ee0d6;--t:#eceef2;--m:#8b909a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans Khmer","Khmer OS",Arial,sans-serif;line-height:1.5}
.hidden{display:none!important}
.wrap{max-width:520px;margin:auto;padding:24px 18px 40px}
.top{margin-bottom:30px}
.back{display:inline-block;padding:8px 14px;color:var(--m);text-decoration:none;border:1px solid var(--l);border-radius:99px;font-size:13px}
.back:hover{color:var(--a);border-color:var(--a)}
.hero{text-align:center;margin-bottom:28px}
.av{width:96px;height:96px;margin:0 auto 16px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--l);border-radius:50%;background:linear-gradient(135deg,#171a20,#0f1115);color:var(--a);font-size:36px;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover}
.name{margin:0 0 14px;font-size:24px;font-weight:800}
h1{margin:0;font-size:30px;line-height:1.3}
.en{margin-top:4px;color:var(--a);font-size:17px;font-weight:600}
.bio{margin:16px auto 0;max-width:400px;color:var(--m);font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.list{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;padding:15px 16px;color:var(--t);text-decoration:none;background:var(--s);border:1px solid var(--l);border-radius:18px;transition:border-color .15s,transform .1s}
a.item:hover{border-color:var(--a)}a.item:active{transform:scale(.985)}
.off{opacity:.5}
.ico{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--l);border-radius:14px;background:var(--s2);color:var(--a)}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:16px}.tx span{display:block;color:var(--m);font-size:12px;overflow-wrap:anywhere}
.go{color:var(--m);font-size:18px}
footer{margin-top:34px;text-align:center}
#year{padding:10px 18px;background:none;border:0;color:var(--m);font:inherit;font-size:12px;cursor:default}
.panel{margin-top:22px;padding:18px;background:var(--s);border:1px solid var(--l);border-radius:18px}
.panel h3{margin:0 0 12px}
.f{display:grid;gap:10px}
input,textarea{width:100%;padding:13px 14px;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:12px;outline:none;font:inherit}
input:focus,textarea:focus{border-color:var(--a)}
textarea{min-height:100px;resize:vertical}
label{display:block;margin:2px 0 -4px;color:var(--m);font-size:12px}
.row{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:12px;color:var(--t);background:var(--s2);border:1px solid var(--l);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.pri{background:var(--a);border-color:var(--a);color:#06201e}
.btn:disabled{opacity:.5}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:90%;padding:11px 18px;background:var(--s2);border:1px solid var(--l);border-radius:99px;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

 <section class="hero">
  <div class="av" id="av">F</div>
  <div class="name" id="name">Fong</div>
  <h1>ទំនាក់ទំនងខ្ញុំ</h1>
  <div class="en">Contact Me</div>
  <p class="bio" id="bio"></p>
 </section>

 <section class="list" id="list"></section>

 <footer><button id="year" type="button">© 2026</button></footer>

 <section id="login" class="panel hidden">
  <h3>Owner Login</h3>
  <div class="f">
   <input id="oe" type="email" autocomplete="username" placeholder="Email">
   <input id="op" type="password" autocomplete="current-password" placeholder="Password">
  </div>
  <div class="row"><button class="btn pri" id="go" type="button">Log In</button></div>
 </section>

 <section id="edit" class="panel hidden">
  <h3>កែប្រែ · Edit</h3>
  <form id="ef" class="f">
   <label>ឈ្មោះ · Name</label><input id="e_name">
   <label>រូបភាព · Picture URL</label><input id="e_pic" type="url" placeholder="https://...">
   <label>ប្រវត្តិ · Bio</label><textarea id="e_bio"></textarea>
   <div id="socF" class="f"></div>
   <div class="row"><button class="btn pri" id="save" type="submit">រក្សាទុក · Save</button><button class="btn" id="out" type="button">Log Out</button></div>
  </form>
 </section>
</div>
<div id="toast"></div>

<script>
'use strict';
const db=supabase.createClient('https://nyuqjxsyhdiefkwuqjzb.supabase.co','sb_publishable_3sEsfdSYpyVAaFS01bXq5A_G0aaJNtN');
const OWNER='0b90c165-87d2-43fd-9be1-1c5c8d0c8c3f';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};

const SOC=[['telegram','តេឡេក្រាម','Telegram'],['discord','ឌីស្កត','Discord'],['youtube','យូធូប','YouTube'],['tiktok','ទីកតុក','TikTok'],['facebook','ហ្វេសប៊ុក','Facebook']];
const ICON={
 telegram:'<path d="M21 4 3 11l5 2 2 6 3-4 5 4z"/><path d="m8 13 9-6"/>',
 discord:'<rect x="3" y="6" width="18" height="12" rx="5"/><circle cx="9" cy="12" r="1.2"/><circle cx="15" cy="12" r="1.2"/>',
 youtube:'<rect x="3" y="6" width="18" height="12" rx="4"/><path d="m10 9.5 5 2.5-5 2.5z"/>',
 tiktok:'<path d="M14 4v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.5 2.5 2 4 5 4.2"/>',
 facebook:'<path d="M14 21v-8h3l.5-3H14V8.2C14 7.2 14.5 6.5 16 6.5h1.7V4A18 18 0 0 0 15.2 4C12.7 4 11 5.5 11 8v2H8v3h3v8"/>'
};

let me=null,P={},tm,taps=0,tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('on'),2600)}
const isOwner=()=>me?.id===OWNER;

function render(){
 const name=(P.creator_name||'').trim()||'Fong',pic=safe(P.profile_picture_url||'');
 $('name').textContent=name;
 $('av').innerHTML=pic?`<img src="${esc(pic)}" alt="">`:esc(name.charAt(0).toUpperCase());
 $('bio').textContent=P.bio||'';
 $('bio').classList.toggle('hidden',!P.bio);
 const list=$('list');list.replaceChildren();
 SOC.forEach(([k,km,en])=>{
  const url=safe(P[k+'_url']||''),el=document.createElement(url?'a':'div');
  el.className='item'+(url?'':' off');
  if(url){el.href=url;el.target='_blank';el.rel='noopener noreferrer'}
  let host='';try{host=new URL(url).hostname.replace(/^www\./,'')}catch{}
  el.innerHTML=`<div class="ico"><svg viewBox="0 0 24 24">${ICON[k]}</svg></div><div class="tx"><b>${km} · ${en}</b><span>${url?esc(host):'មិនទាន់កំណត់ · Not set yet'}</span></div>${url?'<span class="go">↗</span>':''}`;
  list.appendChild(el);
 });
}
function fillForm(){
 $('e_name').value=P.creator_name||'Fong';$('e_pic').value=P.profile_picture_url||'';$('e_bio').value=P.bio||'';
 SOC.forEach(([k])=>$('s_'+k).value=P[k+'_url']||'');
}
function ui(){
 $('edit').classList.toggle('hidden',!isOwner());
 if(isOwner())$('login').classList.add('hidden');
}

$('socF').innerHTML=SOC.map(([k,,en])=>`<label>${en} URL</label><input id="s_${k}" type="url" placeholder="https://...">`).join('');

async function load(){
 const {data,error}=await db.from('creator_profile').select('*').eq('id',1).maybeSingle();
 if(error)console.warn(error.message);
 P=data||{};render();if(isOwner())fillForm();
}

/* Owner entry: tap © 2026 three times */
$('year').onclick=()=>{
 taps++;clearTimeout(tt);tt=setTimeout(()=>taps=0,1200);
 if(taps>=3){taps=0;if(isOwner()){$('edit').scrollIntoView({behavior:'smooth'});return}
  $('login').classList.toggle('hidden');if(!$('login').classList.contains('hidden'))$('oe').focus()}
};
$('go').onclick=async()=>{
 const email=$('oe').value.trim(),password=$('op').value;
 if(!email||!password)return toast('Enter email and password.');
 $('go').disabled=true;
 const {data,error}=await db.auth.signInWithPassword({email,password});
 $('go').disabled=false;
 if(error)return toast(error.message||'Login failed.');
 if(data.user.id!==OWNER){await db.auth.signOut();return toast('This is not the owner account.')}
 $('op').value='';
};
$('out').onclick=()=>db.auth.signOut();

$('ef').onsubmit=async e=>{
 e.preventDefault();if(!isOwner())return;
 const r={...P,id:1,creator_name:$('e_name').value.trim()||'Fong',profile_picture_url:safe($('e_pic').value.trim())||null,bio:$('e_bio').value.trim()};
 SOC.forEach(([k])=>r[k+'_url']=safe($('s_'+k).value.trim())||null);
 $('save').disabled=true;
 const {error}=await db.from('creator_profile').upsert(r,{onConflict:'id'});
 $('save').disabled=false;
 if(error){console.error(error);return toast('Could not save. Check owner permissions.')}
 P=r;render();toast('រក្សាទុករួច · Saved');
};

db.auth.onAuthStateChange((_e,s)=>{const n=s?.user||null;if((n?.id||null)!==(me?.id||null)){me=n;setTimeout(()=>{ui();if(isOwner())fillForm()},0)}});
(async()=>{const {data}=await db.auth.getSession();me=data?.session?.user||null;await load();ui()})();
</script>
</body>
</html>
